title = "Citizen Tech - histórico e credenciais locais"
[extend]
useDefault = true

[[rules]]
id = "citizen-password"
description = "Credencial fixa literal"
regex = '''(?i)\b(?:password|passwd|senha|secret_key|api_token|aws_secret_access_key|jwt_secret)\b\s*[:=]\s*["']([A-Za-z0-9_@.!/+\-]{12,})["']'''
secretGroup = 1

[[rules]]
id = "citizen-compose-password"
description = "Credencial literal em compose"
regex = '''(?m)^[ \t]*POSTGRES_PASSWORD:[ \t]*([A-Za-z0-9_@.!/+\-]{12,})[ \t]*$'''
secretGroup = 1

[[rules]]
id = "citizen-docker-token"
description = "Token literal em imagem"
regex = '''(?m)^ENV[ \t]+API_TOKEN=([A-Za-z0-9_@.!/+\-]{12,})[ \t]*$'''
secretGroup = 1

[[rules]]
id = "citizen-jwt"
description = "JWT armazenado em arquivo"
regex = '''(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)'''
secretGroup = 1
